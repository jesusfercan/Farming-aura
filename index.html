<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Farming - FX & Audio Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080810;
      --card-bg: #13131c;
      --p1: #00f0ff;
      --p2: #ff007f;
      --gold: #ffd700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      overflow-x: hidden;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      background: linear-gradient(90deg, var(--p1), var(--p2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
      text-align: center;
    }

    #banner {
      height: 40px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      text-align: center;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .arena {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 450px;
      margin-bottom: 20px;
      position: relative;
    }

    .player-card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 12px;
      text-align: center;
      border: 2px solid #222;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s, box-shadow 0.3s;
      position: relative;
    }

    .player-card.active-p1 {
      border-color: var(--p1);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      transform: scale(1.03);
    }

    .player-card.active-p2 {
      border-color: var(--p2);
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
      transform: scale(1.03);
    }

    /* ANIMACIÓN DE IMPACTO / SHAKE */
    @keyframes auraImpact {
      0% { transform: scale(1.03) translateY(0); }
      20% { transform: scale(1.15) translateY(-10px) rotate(-2deg); }
      40% { transform: scale(1.1) translateY(0) rotate(2deg); }
      60% { transform: scale(1.08) translateY(-4px); }
      100% { transform: scale(1.03) translateY(0); }
    }

    .player-card.impact {
      animation: auraImpact 0.5s ease-out;
    }

    .avatar-wrapper {
      width: 100%;
      height: 160px;
      margin: 0 auto 10px;
      background: #000;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
    }

    .avatar-gif {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .avatar-emoji { font-size: 3.5rem; }

    .score-val {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      transition: transform 0.2s ease, color 0.2s;
    }

    /* ANIMACIÓN DE PUNTUACIÓN */
    @keyframes scorePop {
      0% { transform: scale(1); }
      50% { transform: scale(1.6); color: var(--gold); }
      100% { transform: scale(1); }
    }

    .score-val.pop {
      animation: scorePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #p1-score { color: var(--p1); }
    #p2-score { color: var(--p2); }

    /* TEXTO FLOTANTE DE PUNTOS (+AURA) */
    .floating-points {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px #000;
      pointer-events: none;
      opacity: 0;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, -20px) scale(0.8); }
      50% { transform: translate(-50%, -60px) scale(1.3); }
      100% { opacity: 0; transform: translate(-50%, -100px) scale(1); }
    }

    .floating-points.animate {
      animation: floatUp 0.8s ease-out forwards;
    }

    .btn-start {
      background: linear-gradient(135deg, var(--p1), var(--p2));
      color: #000;
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      padding: 16px 36px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      text-transform: uppercase;
      margin-bottom: 15px;
      transition: transform 0.1s ease;
    }

    .btn-start:active { transform: scale(0.95); }

    .btn-start:disabled {
      opacity: 0.4;
      filter: grayscale(1);
    }

    .log-container {
      width: 100%;
      max-width: 450px;
      background: #000;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #00ff66;
      height: 90px;
      overflow-y: auto;
    }

    .log-entry { margin-bottom: 4px; word-break: break-all; }
    .log-info { color: #00f0ff; }
  </style>
</head>
<body>

  <h1>AURA FARMING</h1>
  <div id="banner">PRESIONA INICIAR PARA JUGAR</div>

  <div class="arena">
    <!-- JUGADOR 1 -->
    <div id="p1-card" class="player-card">
      <div style="color: var(--p1); font-weight: bold; margin-bottom: 8px;">JUGADOR 1</div>
      <div class="avatar-wrapper">
        <div id="p1-emoji" class="avatar-emoji">🗿</div>
        <img id="p1-gif" class="avatar-gif" alt="p1 gif">
      </div>
      <div id="p1-score" class="score-val">0</div>
      <div id="p1-float" class="floating-points">+0</div>
    </div>

    <!-- JUGADOR 2 -->
    <div id="p2-card" class="player-card">
      <div style="color: var(--p2); font-weight: bold; margin-bottom: 8px;">JUGADOR 2</div>
      <div class="avatar-wrapper">
        <div id="p2-emoji" class="avatar-emoji">👑</div>
        <img id="p2-gif" class="avatar-gif" alt="p2 gif">
      </div>
      <div id="p2-score" class="score-val">0</div>
      <div id="p2-float" class="floating-points">+0</div>
    </div>
  </div>

  <button id="start-btn" class="btn-start">INICIAR DUELO</button>

  <div style="width: 100%; max-width: 450px; margin-bottom: 5px; font-size: 0.8rem; color: #888;">LOGS DE SISTEMA Y AUDIO:</div>
  <div id="log-box" class="log-container"></div>

  <script>
    const GIPHY_API_KEY = '5yg1leisOrrr7YY0BeZeVMaPxaMRgQdE'; 

    // LISTA AMPLIADA DE MOVIMIENTOS AURA CON BÚSQUEDAS ESPECÍFICAS
    const AURA_MOVES = [
      { name: 'SIX SEVEN', query: '67 meme funny' },
      { name: 'RIZZ FACE', query: 'rizz face meme' },
      { name: 'MEWING', query: 'mewing jawline meme' },
      { name: 'SIGMA STAREDOWN', query: 'sigma stare patrick bateman' },
      { name: 'CRISTIANO SIUUU', query: 'cristiano ronaldo siuuuu' },
      { name: 'SUPREME RIZZ', query: 'unspoken rizz meme' },
      { name: 'GIGACHAD FLEX', query: 'gigachad chad meme' },
      { name: 'LOOKSMAXXING', query: 'bye bye meme' },
      { name: 'SUPER SAIYAN AURA', query: 'anime aura glow powerup' },
      { name: 'FINAL BOSS', query: 'final boss aura meme' }
    ];

    let gifsCache = {};
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      if (type === 'turn') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.15);

      } else if (type === 'impact') {
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sawtooth';
        osc2.type = 'triangle';

        osc1.frequency.setValueAtTime(150, now);
        osc1.frequency.exponentialRampToValueAtTime(800, now + 0.3);

        osc2.frequency.setValueAtTime(300, now);
        osc2.frequency.exponentialRampToValueAtTime(1200, now + 0.3);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.4);
        osc2.stop(now + 0.4);

      } else if (type === 'victory') {
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const startTime = now + (idx * 0.1);

          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.15, startTime);
          gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.25);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(startTime);
          osc.stop(startTime + 0.25);
        });
      }
    }

    function addLog(msg, type = 'normal') {
      const logBox = document.getElementById('log-box');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type === 'info' ? 'log-info' : ''}`;
      const time = new Date().toLocaleTimeString();
      entry.innerText = `[${time}] ${msg}`;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function fetchOptimizedGiphy(moveQuery) {
      if (gifsCache[moveQuery]) return gifsCache[moveQuery];

      const url = `https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_API_KEY}&q=${encodeURIComponent(moveQuery)}&limit=8&rating=pg-13&lang=es`;

      try {
        const response = await fetch(url);
        if (!response.ok) return [];

        const json = await response.json();
        if (json.data && json.data.length > 0) {
          const urls = json.data.map(item => item.images.fixed_height.url || item.images.original.url);
          gifsCache[moveQuery] = urls;
          return urls;
        }
      } catch (error) {
        addLog(`Error en búsqueda: ${error.message}`);
      }
      return [];
    }

    function resetVisuals() {
      document.querySelectorAll('.avatar-gif').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.avatar-emoji').forEach(el => el.style.display = 'block');
      document.querySelectorAll('.player-card').forEach(el => {
        el.classList.remove('active-p1', 'active-p2', 'impact');
      });
    }

    async function playTurn(playerNum) {
      resetVisuals();

      playSound('turn');
      const move = AURA_MOVES[Math.floor(Math.random() * AURA_MOVES.length)];
      const card = document.getElementById(`p${playerNum}-card`);
      const emoji = document.getElementById(`p${playerNum}-emoji`);
      const img = document.getElementById(`p${playerNum}-gif`);
      const scoreEl = document.getElementById(`p${playerNum}-score`);
      const floatEl = document.getElementById(`p${playerNum}-float`);
      const banner = document.getElementById('banner');

      card.classList.add(playerNum === 1 ? 'active-p1' : 'active-p2');
      banner.innerText = `J${playerNum} ejecutando ${move.name}...`;

      addLog(`Consultando query: "${move.query}"`, 'info');
      const pool = await fetchOptimizedGiphy(move.query);

      if (pool.length > 0) {
        const topPool = pool.slice(0, 4);
        const gifUrl = topPool[Math.floor(Math.random() * topPool.length)];
        img.src = gifUrl;

        await new Promise((resolve) => {
          img.onload = () => {
            emoji.style.display = 'none';
            img.style.display = 'block';
            resolve();
          };
          img.onerror = () => resolve();
          setTimeout(resolve, 2500);
        });
      }

      const points = (Math.floor(Math.random() * 5) + 1) * 250;
      banner.innerText = `J${playerNum}: ¡${move.name}! (+${points} Aura)`;

      playSound('impact');

      card.classList.add('impact');
      scoreEl.classList.add('pop');

      floatEl.innerText = `+${points}`;
      floatEl.classList.remove('animate');
      void floatEl.offsetWidth;
      floatEl.classList.add('animate');

      scoreEl.innerText = parseInt(scoreEl.innerText) + points;

      setTimeout(() => {
        scoreEl.classList.remove('pop');
        card.classList.remove('impact');
      }, 500);

      await new Promise(res => setTimeout(res, 2200));
    }

    async function startAutoGame() {
      initAudio();

      if (GIPHY_API_KEY === 'TU_API_KEY_AQUÍ' || !GIPHY_API_KEY) {
        alert("Pega tu API Key de Giphy en la constante GIPHY_API_KEY dentro del script.");
        return;
      }

      const startBtn = document.getElementById('start-btn');
      const banner = document.getElementById('banner');
      document.getElementById('log-box').innerHTML = '';

      startBtn.disabled = true;
      document.getElementById('p1-score').innerText = '0';
      document.getElementById('p2-score').innerText = '0';

      addLog("Iniciando partidas a 5 rondas...", 'info');

      // BUCLE CONFIGURADO A 5 RONDAS
      for (let r = 1; r <= 5; r++) {
        banner.innerText = `--- RONDA ${r} DE 5 ---`;
        await new Promise(res => setTimeout(res, 800));

        await playTurn(1);
        await playTurn(2);
      }

      resetVisuals();
      const p1 = parseInt(document.getElementById('p1-score').innerText);
      const p2 = parseInt(document.getElementById('p2-score').innerText);

      playSound('victory');

      if (p1 > p2) banner.innerText = "🏆 ¡JUGADOR 1 ES EL AURA MASTER!";
      else if (p2 > p1) banner.innerText = "🏆 ¡JUGADOR 2 ES EL AURA MASTER!";
      else banner.innerText = "🤝 ¡EMPATE TÁCTICO DE AURA!";

      startBtn.disabled = false;
    }

    document.getElementById('start-btn').onclick = startAutoGame;
  </script>
</body>
</html>
